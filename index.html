<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STYLISH ACTION — 鬼泣式动作游戏模板 Demo</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07060d;overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    background:#000;outline:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720" tabindex="0"></canvas></div>

<!-- 模板结构：
     core/engine.js   引擎底座（常量/工具/输入/音效/特效）
     data/*.js        纯数据：角色技能表、敌人图鉴（改内容不用碰逻辑）
     core/entities.js 战斗实体（玩家状态机/敌人AI/Boss阶段机）
     core/game.js     游戏流程与HUD（波次脚本、风格评级、支援律令输入）
-->
<script src="core/engine.js"></script>
<script src="data/characters.js"></script>
<script src="data/enemies.js"></script>
<script src="core/entities.js"></script>
<script src="core/game.js"></script>
<script>document.getElementById('cv').focus();</script>
</body>
</html>
